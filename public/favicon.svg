<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D070"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A1E"/>
      <stop offset="100%" stop-color="#09090B"/>
    </radialGradient>
  </defs>
  <!-- Background Card -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)"/>
  <rect width="92" height="92" x="4" y="4" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Barber Scissors and Comb Icon -->
  <g transform="translate(50, 48)">
    <!-- Scissors Blades -->
    <path d="M-18 -26 Q-8 -12 0 0 L-5 7 Q-12 14 -18 7 Q-23 0 -18 -12 Z" fill="url(#goldGrad)"/>
    <path d="M18 -26 Q8 -12 0 0 L5 7 Q12 14 18 7 Q23 0 18 -12 Z" fill="url(#goldGrad)"/>
    <!-- Scissor Finger Loops -->
    <circle cx="-16" cy="20" r="8.5" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <circle cx="16" cy="20" r="8.5" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <!-- Center Pivot Pin -->
    <circle cx="0" cy="0" r="3.5" fill="#09090B" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>
</svg>
